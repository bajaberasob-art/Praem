kind = "web"
previewPath = "/"
title = "PRIME Discord Dashboard"
description = "A deployable Discord bot control dashboard backed by the existing PRIME bot service, with OAuth-protected administration and live server controls."
version = "1.0.0"
id = "artifacts/prime-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21849

[services.development]
run = "pnpm --filter @workspace/prime-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prime-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/prime-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21849"
BASE_PATH = "/"
